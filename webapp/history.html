<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>History - Huffman Compressor</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <span class="brand">Huffman Compressor</span>
    <a href="index.html">Encode</a>
    <a href="decode.html">Decode</a>
    <a href="history" class="active">History</a>
  </nav>

  <main class="container">
    <h1>Saved records</h1>

    <section class="card">
      <div class="table-wrap">
        <table>
          <tr>
            <th>ID</th><th>Text</th><th>Original</th><th>Compressed</th>
            <th>Saved %</th><th>Date</th><th>Actions</th>
          </tr>

          <tr>
            <td>1</td>
            <td>ABRACADABRA</td>
            <td>88</td>
            <td>23</td>
            <td>73.86%</td>
            <td>2026-11-22</td>
            <td>
              <!-- View: GET /record?id=1 (HistoryServlet) -->
              <a class="btn small secondary" href="record?id=1">View</a>

              <form action="delete" method="post" style="display:inline">
                <input type="hidden" name="id" value="1">
                <button class="btn small danger" type="submit"
                        onclick="return confirm('Are you sure you want to delete this record?')">Delete</button>
              </form>
            </td>
          </tr>
        </table>
      </div>
    </section>
  </main>

</body>
</html>
